<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Географічна карта</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html { height: 100%; width: 100%; overflow: hidden; }

    /* ── Full-screen map ── */
    #map { position: fixed; inset: 0; }

    /* ── Top overlay bar ── */
    #top-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      width: min(460px, calc(100vw - 24px));
    }

    #search-input {
      flex: 1;
      padding: 9px 14px;
      border: none;
      border-radius: 24px;
      background: rgba(255,255,255,0.97);
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      font-size: 14px;
      color: #1a1a2e;
      outline: none;
    }
    #search-input::placeholder { color: #999; }

    /* ── Status chip ── */
    #status-chip {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(20,20,30,0.85);
      color: #eee;
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      transition: opacity .4s;
    }
    #status-chip.hidden { opacity: 0; pointer-events: none; }

    /* ── Search results dropdown ── */
    #search-results {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: min(460px, calc(100vw - 24px));
      z-index: 100;
      background: rgba(255,255,255,0.97);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      max-height: 260px;
      overflow-y: auto;
      display: none;
    }

    .result-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: background .1s;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: #fff0f0; }
    .result-name  { font-size: 13px; font-weight: 600; color: #1a1a2e; }
    .result-addr  { font-size: 11px; color: #888; margin-top: 2px; }

    /* ── InfoWindow override ── */
    .iw-body { font-family: 'Segoe UI', Arial, sans-serif; min-width: 200px; }
    .iw-name { font-size: 14px; font-weight: 700; color: #0d1117; margin-bottom: 4px; }
    .iw-addr { font-size: 12px; color: #555; }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Search bar -->
<div id="top-bar">
  <input id="search-input" type="text" placeholder="🔍 Пошук за прізвищем…" autocomplete="off" />
</div>

<!-- Search results dropdown -->
<div id="search-results"></div>

<!-- Status chip -->
<div id="status-chip">Завантаження…</div>

<script>
  'use strict';

  const GEOCODE_DELAY_MS = 200;

  let map, geocoder, infoWindow;
  let peopleData = [];
  const markers  = {};

  function makeIcon() {
    return {
      path:         google.maps.SymbolPath.CIRCLE,
      scale:        9,
      fillColor:    '#e53935',
      fillOpacity:  0.95,
      strokeColor:  '#7f0000',
      strokeWeight: 1.5
    };
  }

  async function initApp() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 49.422, lng: 26.987 },
      zoom: 9,
      mapTypeId: 'roadmap',
      fullscreenControl: true,
      streetViewControl: false,
      zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
      mapTypeControlOptions: { position: google.maps.ControlPosition.TOP_RIGHT }
    });

    geocoder   = new google.maps.Geocoder();
    infoWindow = new google.maps.InfoWindow();
    map.addListener('click', () => {
      infoWindow.close();
      hideResults();
    });

    setStatus('Завантаження даних…');

    const res  = await fetch('/data.json');
    peopleData = await res.json();

    setStatus(`Геокодування 0 / ${peopleData.length}…`);
    setupSearch();
    await geocodeAll();
  }

  /* ── Geocode all ── */
  async function geocodeAll() {
    let placed = 0, failed = 0;

    for (let i = 0; i < peopleData.length; i++) {
      await new Promise(resolve => {
        geocoder.geocode(
          { address: peopleData[i].address + ', Україна', region: 'UA' },
          (results, status) => {
            if (status === 'OK' && results.length > 0) {
              addMarker(i, results[0].geometry.location);
              placed++;
            } else {
              console.warn(`[FAIL] ${peopleData[i].name} | ${peopleData[i].address} | ${status}`);
              failed++;
            }
            const done = placed + failed;
            const pct  = Math.round((done / peopleData.length) * 100);

            if (done < peopleData.length) {
              setStatus(`Геокодування ${done} / ${peopleData.length}… (${pct}%)`);
            } else {
              const msg = `✅ ${placed} позначок${failed ? `  ❌ ${failed} не знайдено` : ''}`;
              setStatus(msg);
              // fade out after 4 s
              setTimeout(() => {
                document.getElementById('status-chip').classList.add('hidden');
              }, 4000);
            }
            resolve();
          }
        );
      });
      await sleep(GEOCODE_DELAY_MS);
    }
  }

  /* ── Add red marker ── */
  function addMarker(i, position) {
    const p = peopleData[i];
    const marker = new google.maps.Marker({
      map,
      position,
      title: p.name,
      label: {
        text:       p.surname,
        fontSize:   '11px',
        fontWeight: 'bold',
        color:      '#ffffff'
      },
      icon: makeIcon()
    });
    marker.addListener('click', () => {
      infoWindow.setContent(
        `<div class="iw-body">` +
          `<div class="iw-name">${esc(p.name)}</div>` +
          `<div class="iw-addr">${esc(p.address)}</div>` +
        `</div>`
      );
      infoWindow.open(map, marker);
      hideResults();
    });
    markers[i] = marker;
  }

  /* ── Search ── */
  function setupSearch() {
    const input   = document.getElementById('search-input');
    const results = document.getElementById('search-results');

    input.addEventListener('input', function () {
      const q = this.value.trim().toLowerCase();
      if (!q) { hideResults(); return; }

      const hits = peopleData
        .map((p, i) => ({ p, i }))
        .filter(({ p }) =>
          p.name.toLowerCase().includes(q) || p.address.toLowerCase().includes(q)
        )
        .slice(0, 10);

      if (!hits.length) { hideResults(); return; }

      results.innerHTML = hits.map(({ p, i }) =>
        `<div class="result-item" data-idx="${i}">` +
          `<div class="result-name">${esc(p.name)}</div>` +
          `<div class="result-addr">${esc(p.address)}</div>` +
        `</div>`
      ).join('');

      results.style.display = 'block';

      results.querySelectorAll('.result-item').forEach(el => {
        el.addEventListener('click', () => {
          focusPerson(Number(el.dataset.idx));
          input.value = '';
          hideResults();
        });
      });
    });

    input.addEventListener('blur', () => setTimeout(hideResults, 150));
  }

  function focusPerson(i) {
    const marker = markers[i];
    if (!marker) return;
    map.panTo(marker.getPosition());
    map.setZoom(15);
    const p = peopleData[i];
    infoWindow.setContent(
      `<div class="iw-body">` +
        `<div class="iw-name">${esc(p.name)}</div>` +
        `<div class="iw-addr">${esc(p.address)}</div>` +
      `</div>`
    );
    infoWindow.open(map, marker);
  }

  function hideResults() {
    document.getElementById('search-results').style.display = 'none';
  }

  /* ── Helpers ── */
  function setStatus(text) {
    const chip = document.getElementById('status-chip');
    chip.textContent = text;
    chip.classList.remove('hidden');
  }
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>

<!-- Google Maps API -->
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDaIydo87nxHMB6SuC_XlxvrM6Bwk_Cwhs&callback=initApp&language=uk&region=UA"
  async defer>
</script>

</body>
</html>
