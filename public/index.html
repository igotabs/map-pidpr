<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Географічна карта</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }

    #map { position: fixed; inset: 0; background: #e5e3df; }

    /* Search bar */
    #top-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: min(460px, calc(100vw - 24px));
    }
    #search-input {
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 24px;
      background: rgba(255,255,255,0.97);
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      font-size: 14px;
      color: #1a1a2e;
      outline: none;
    }
    #search-input::placeholder { color: #999; }

    #search-results {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: min(460px, calc(100vw - 24px));
      z-index: 100;
      background: rgba(255,255,255,0.98);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      max-height: 260px;
      overflow-y: auto;
      display: none;
    }
    .result-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: #fff0f0; }
    .result-name { font-size: 13px; font-weight: 600; color: #1a1a2e; }
    .result-addr { font-size: 11px; color: #888; margin-top: 2px; }

    /* Status chip */
    #status-chip {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(20,20,30,0.85);
      color: #eee;
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      transition: opacity .4s;
    }
    #status-chip.hidden { opacity: 0; pointer-events: none; }

    /* Error banner */
    #err {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: center; justify-content: center;
      background: #1a1a2e; color: #ff8080; font-family: Arial, sans-serif;
      font-size: 15px; text-align: center; padding: 24px;
    }

    .iw-body { font-family: 'Segoe UI', Arial, sans-serif; min-width: 200px; }
    .iw-name { font-size: 14px; font-weight: 700; color: #0d1117; margin-bottom: 4px; }
    .iw-addr { font-size: 12px; color: #555; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="top-bar">
  <input id="search-input" type="text" placeholder="🔍 Пошук за прізвищем…" autocomplete="off" />
</div>
<div id="search-results"></div>
<div id="status-chip">Завантаження…</div>
<div id="err"></div>

<script>
  'use strict';

  let map, infoWindow;
  let peopleData = [];
  const markers  = {};

  function redIcon() {
    return {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 9,
      fillColor: '#e53935',
      fillOpacity: 0.95,
      strokeColor: '#7f0000',
      strokeWeight: 1.5
    };
  }

  /* Called by Google Maps API */
  async function initApp() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 49.422, lng: 26.987 },
      zoom: 9,
      mapTypeId: 'roadmap',
      fullscreenControl: true,
      streetViewControl: false,
      zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
      mapTypeControlOptions: { position: google.maps.ControlPosition.TOP_RIGHT }
    });

    infoWindow = new google.maps.InfoWindow();
    map.addListener('click', () => { infoWindow.close(); hideResults(); });

    try {
      const res  = await fetch('/data.json');
      peopleData = await res.json();
    } catch (e) {
      return setStatus('❌ Не вдалося завантажити data.json');
    }

    placeMarkers();   // instant – coords are pre-baked
    setupSearch();
  }

  /* Place all markers immediately from cached lat/lng */
  function placeMarkers() {
    const bounds = new google.maps.LatLngBounds();
    let count = 0;

    peopleData.forEach((p, i) => {
      if (p.lat == null || p.lng == null) return;
      const position = { lat: p.lat, lng: p.lng };

      const marker = new google.maps.Marker({
        map,
        position,
        title: p.name,
        label: { text: p.surname, fontSize: '11px', fontWeight: 'bold', color: '#ffffff' },
        icon: redIcon()
      });
      marker.addListener('click', () => openInfo(i));
      markers[i] = marker;
      bounds.extend(position);
      count++;
    });

    if (count > 0) {
      map.fitBounds(bounds);
      if (count === 1) map.setZoom(14);
    }

    setStatus(`✅ ${count} позначок`);
    setTimeout(() => document.getElementById('status-chip').classList.add('hidden'), 3500);
  }

  function openInfo(i) {
    const p = peopleData[i];
    infoWindow.setContent(
      `<div class="iw-body">` +
        `<div class="iw-name">${esc(p.name)}</div>` +
        `<div class="iw-addr">${esc(p.address)}</div>` +
      `</div>`
    );
    infoWindow.open(map, markers[i]);
  }

  function focusPerson(i) {
    const m = markers[i];
    if (!m) return;
    map.panTo(m.getPosition());
    map.setZoom(15);
    openInfo(i);
  }

  /* Search */
  function setupSearch() {
    const input   = document.getElementById('search-input');
    const results = document.getElementById('search-results');

    input.addEventListener('input', function () {
      const q = this.value.trim().toLowerCase();
      if (!q) return hideResults();

      const hits = peopleData
        .map((p, i) => ({ p, i }))
        .filter(({ p }) => p.name.toLowerCase().includes(q) || p.address.toLowerCase().includes(q))
        .slice(0, 10);

      if (!hits.length) return hideResults();

      results.innerHTML = hits.map(({ p, i }) =>
        `<div class="result-item" data-idx="${i}">` +
          `<div class="result-name">${esc(p.name)}</div>` +
          `<div class="result-addr">${esc(p.address)}</div>` +
        `</div>`
      ).join('');
      results.style.display = 'block';

      results.querySelectorAll('.result-item').forEach(el => {
        el.addEventListener('click', () => {
          focusPerson(Number(el.dataset.idx));
          input.value = '';
          hideResults();
        });
      });
    });

    input.addEventListener('blur', () => setTimeout(hideResults, 150));
  }

  function hideResults() { document.getElementById('search-results').style.display = 'none'; }

  function setStatus(text) {
    const chip = document.getElementById('status-chip');
    chip.textContent = text;
    chip.classList.remove('hidden');
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* Surface Google Maps auth failures instead of a blank page */
  window.gm_authFailure = function () {
    const el = document.getElementById('err');
    el.style.display = 'flex';
    el.innerHTML = '⚠ Помилка Google Maps: ключ API відхилено ' +
                   '(перевірте обмеження ключа / білінг / дозволені домени).';
  };
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDaIydo87nxHMB6SuC_XlxvrM6Bwk_Cwhs&callback=initApp&language=uk&region=UA"
  async defer
  onerror="document.getElementById('err').style.display='flex';document.getElementById('err').textContent='⚠ Не вдалося завантажити Google Maps API (мережа/ключ).';">
</script>

</body>
</html>
